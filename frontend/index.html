<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FM27 Skin Editor</title>
<style>
:root{--bg:#14161a;--panel:#1c1f25;--line:#2c313a;--fg:#dfe3ea;--dim:#8b93a1;--acc:#e0475f;--ok:#4fb477;--warn:#e0a947}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
header b{font-size:14px;letter-spacing:.04em}
nav button{background:none;border:0;color:var(--dim);padding:13px 10px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-color:var(--acc)}
#proj{margin-left:auto;display:flex;gap:6px;align-items:center}
main{padding:16px;display:none}main.on{display:block}
.cols{display:grid;grid-template-columns:minmax(380px,1fr) minmax(380px,1fr);gap:16px;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.box h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.list{max-height:72vh;overflow:auto}
table{border-collapse:collapse;width:100%}td,th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:500;position:sticky;top:0;background:var(--panel)}
tr.pick{cursor:pointer}tr.pick:hover{background:#242831}
code,.mono{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #0008;vertical-align:-2px;margin-right:6px;
  background-image:linear-gradient(45deg,#888 25%,transparent 25%,transparent 75%,#888 75%),linear-gradient(45deg,#888 25%,#ccc 25%,#ccc 75%,#888 75%);background-size:8px 8px;background-position:0 0,4px 4px;overflow:hidden}
.sw i{display:block;width:100%;height:100%}
.ed{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
input,select,button,textarea{font:inherit;color:var(--fg);background:#101216;border:1px solid var(--line);border-radius:4px;padding:5px 8px}
input[type=color]{padding:0;width:34px;height:28px;vertical-align:middle}
button{cursor:pointer;background:#262b34}button:hover{border-color:var(--dim)}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default}
.dim{color:var(--dim)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
#msg{position:fixed;right:16px;bottom:16px;max-width:520px;padding:10px 14px;border-radius:6px;background:#2a1418;border:1px solid var(--acc);display:none;white-space:pre-wrap}
#msg.good{background:#14261b;border-color:var(--ok)}
progress{width:220px}
.pv{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.pvwrap{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000;line-height:0}
.pvwrap canvas{width:100%;height:auto;display:block}
#pvo{position:absolute;left:0;top:0;cursor:crosshair}
.imgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.imc{background:#101216;border:1px solid var(--line);border-radius:6px;padding:6px;cursor:pointer;line-height:1.3}
.imc:hover{border-color:var(--dim)}.imc.on{border-color:var(--acc)}.imc.sw{box-shadow:inset 0 0 0 2px var(--ok)}
.imc img{width:100%;aspect-ratio:16/10;object-fit:contain;background:repeating-conic-gradient(#222 0 25%,#2a2a2a 0 50%) 0 0/16px 16px;border-radius:4px;display:block}
.imc .n{font:11px ui-monospace,Consolas,monospace;word-break:break-all;margin-top:4px}.imc .d{color:var(--dim);font-size:11px}
.imbig{width:100%;background:repeating-conic-gradient(#222 0 25%,#2a2a2a 0 50%) 0 0/16px 16px;border-radius:4px;display:block}
.pvtip{position:absolute;pointer-events:none;background:#000c;color:#fff;padding:4px 7px;border-radius:4px;font:11px ui-monospace,Consolas,monospace;white-space:nowrap;display:none;line-height:1.4;z-index:1}
</style>
</head>
<body>
<header>
  <b>FM27 SKIN EDITOR</b>
  <nav id="nav"></nav>
  <div id="proj"><span class="dim">Project</span><select id="projsel"></select><button id="projnew">New</button></div>
</header>
<main id="setup"></main>
<main id="tokens"><div class="cols">
  <div class="box"><div class="row"><input id="tq" placeholder="Search name, value or hex code (AF78FF)" size="38">
    <label><input type="checkbox" id="tcol" checked> colours only</label><span id="tcount" class="dim"></span></div>
    <div class="row"><input id="wq" placeholder="Where is a class or selector used? (e.g. tactics-collapsable-pitch-container)" size="38"><button id="wgo">Where?</button></div>
    <div class="list" id="tlist"></div></div>
  <div id="tdetail"></div></div></main>
<main id="literals"><div class="cols">
  <div class="box"><div class="row"><input id="lq" placeholder="Search hex code (AF78FF or AF78FF80)" size="38"><span id="lcount" class="dim"></span></div><div class="list" id="llist"></div></div>
  <div id="ldetail"></div></div></main>
<main id="preview"></main>
<main id="images"></main>
<main id="compare"></main>
<main id="layout"><div class="cols"><div class="box" id="lyscreens"></div><div id="lydetail"></div></div></main>
<main id="project"></main>
<main id="build"></main>
<main id="verify"></main>
<div id="msg"></div>
<script>
const T = new URLSearchParams(location.search).get("t") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Colours: canonical object {rgb: "#RRGGBB", a: float 0..1}. Col is the only conversion code on this side
   (mirrors skin_editor/colour.py). The alpha float is kept in full; three decimals and the hex byte are display. */
const Col = {
  is: v => !!v && typeof v === "object" && typeof v.rgb === "string" && typeof v.a === "number",
  byte: a => Math.floor(Math.min(1, Math.max(0, a)) * 255 + 0.5),
  hex2: b => b.toString(16).toUpperCase().padStart(2, "0"),
  hex8: o => o.rgb.toUpperCase() + Col.hex2(Col.byte(o.a)),
  text: o => Col.byte(o.a) === 255 ? o.rgb.toUpperCase() : Col.hex8(o),
  css: o => `rgba(${parseInt(o.rgb.slice(1, 3), 16)},${parseInt(o.rgb.slice(3, 5), 16)},${parseInt(o.rgb.slice(5, 7), 16)},${o.a})`,
  parse: s => { s = String(s).trim(); let m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(s);
    return m ? {rgb: "#" + m[1].toUpperCase(), a: m[2] === undefined ? 1 : parseInt(m[2], 16) / 255} : null; },
  same: (x, y) => x.rgb.toUpperCase() === y.rgb.toUpperCase() && Math.abs(x.a - y.a) <= 1e-6,
};
const sw = c => { const o = Col.is(c) ? c : Col.parse(c || ""); return o ? `<span class="sw"><i style="background:${Col.css(o)}"></i></span>` : ""; };
const fmt = o => `${sw(o)}<span class="mono">${o.rgb.toUpperCase()}</span> <span class="dim">alpha</span> <span class="mono">${o.a.toFixed(3)}</span> <span class="dim mono">${Col.hex8(o)}</span>`;
const val = v => Col.is(v) ? fmt(v) : `<span class="mono">${esc(v)}</span>`;
/* RGBA editor: picker + hex6 for RGB, alpha as a 0..1 float and as the last byte of the 8-digit hex, all synced.
   ED[id] holds the value; an alpha the user did not touch keeps its full stored precision. */
const ED = {};
function rgbaEditor(id, o, rgbOnly) { ED[id] = {rgb: o.rgb.toUpperCase(), a: rgbOnly ? 1 : o.a};
  return `<span class="ed" data-ed="${id}"><input type="color" data-f="pick" value="${o.rgb.toLowerCase()}"><input data-f="hex6" class="mono" size="8" value="${ED[id].rgb}">` +
    (rgbOnly ? "" : `<label class="dim">alpha <input data-f="a" type="number" min="0" max="1" step="0.001" value="${o.a.toFixed(3)}" style="width:84px"></label><input data-f="hex8" class="mono" size="10" value="${Col.hex8(o)}" title="8-digit hex; the last two digits are the alpha byte">`) +
    `<span data-f="sw">${sw(ED[id])}</span></span>`; }
document.addEventListener("input", e => { const box = e.target.closest && e.target.closest("[data-ed]"); if (!box) return;
  const st = ED[box.dataset.ed], f = e.target.dataset.f, v = e.target.value.trim(), q = k => box.querySelector(`[data-f="${k}"]`);
  if (f === "pick") st.rgb = v.toUpperCase();
  else if (f === "hex6") { if (!/^#[0-9a-f]{6}$/i.test(v)) return; st.rgb = v.toUpperCase(); }
  else if (f === "a") { const a = parseFloat(v); if (!(a >= 0 && a <= 1)) return; st.a = a; }
  else if (f === "hex8") { const o = Col.parse(v); if (!o || v.length !== 9) return; st.rgb = o.rgb; st.a = o.a; }
  if (f !== "pick") q("pick").value = st.rgb.toLowerCase();
  if (f !== "hex6") q("hex6").value = st.rgb;
  if (q("a") && f !== "a") q("a").value = st.a.toFixed(3);
  if (q("hex8") && f !== "hex8") q("hex8").value = Col.hex8(st);
  q("sw").innerHTML = sw(st); });
let S = null, P = null, pages = ["setup","tokens","literals","preview","images","compare","layout","project","build","verify"];

function say(text, good) { const m = $("msg"); m.textContent = text; m.className = good ? "good" : ""; m.style.display = "block";
  clearTimeout(say.t); say.t = setTimeout(() => m.style.display = "none", good ? 3500 : 9000); }
async function api(path, body, raw) {
  const r = await fetch(path, {method: body === undefined ? "GET" : "POST", headers: {"X-Token": T},
    body: body === undefined ? undefined : raw ? body : JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) { say(j.error || "request failed"); throw new Error(j.error); }
  return j;
}
async function job(start) {
  let j = await start;
  while (j.running) { renderJob(j); await new Promise(r => setTimeout(r, 500)); j = await api("/api/job"); }
  renderJob(j);
  if (j.error) { say(j.error); throw new Error(j.error); }
  return j.result;
}
function renderJob(j) { document.querySelectorAll(".jobbar").forEach(e => e.innerHTML = j.running ?
  `<progress value="${j.progress}" max="1"></progress> <span class="dim">${esc(j.label)}</span>` : ""); }

function show(p) { pages.forEach(x => { $(x).classList.toggle("on", x === p); });
  [...$("nav").children].forEach(b => b.classList.toggle("on", b.dataset.p === p));
  ({setup: drawSetup, tokens: drawTokens, literals: drawLiterals, preview: drawPreview, images: drawImages, compare: drawCompare, layout: drawLayout, project: drawProject, build: drawBuild, verify: drawVerify})[p](); }
$("nav").innerHTML = pages.map(p => `<button data-p="${p}">${p[0].toUpperCase() + p.slice(1)}</button>`).join("");
$("nav").onclick = e => e.target.dataset.p && show(e.target.dataset.p);

async function refresh() { S = await api("/api/state");
  const names = S.projects.includes(P?.name) || !P ? S.projects : [P.name, ...S.projects];
  $("projsel").innerHTML = names.map(n => `<option ${P && n === P.name ? "selected" : ""}>${esc(n)}</option>`).join("") || "<option value=''>none</option>";
  if (!P && S.projects.length) await loadProject(S.projects[0]); }
async function loadProject(name) { P = await api("/api/project?name=" + encodeURIComponent(name)); }
async function saveProject() { const r = await api("/api/project", P); P = r.project; await refresh();
  say("Saved " + P.name + (r.warnings.length ? "\n" + r.warnings.join("\n") : ""), true); }
$("projsel").onchange = async e => { if (e.target.value) { lastReport = lastReach = null; await loadProject(e.target.value); show(document.querySelector("main.on").id); } };
$("projnew").onclick = () => { newForm = true; show("project"); };
let newForm = false;
function needProject() { if (!P) { say("Create a project first (New, top right)"); return false; } return true; }

/* ---------- setup */
async function drawSetup() { await refresh(); const i = S.install, st = {vanilla:"ok", skinned:"warn", changed:"bad", missing:"bad", no_snapshot:"dim"};
  $("setup").innerHTML = `
  <div class="box"><h3>Game install</h3>
    ${i ? `<table><tr><td>Path</td><td class="mono">${esc(i.game_dir)}</td></tr><tr><td>Bundles</td><td class="mono">${esc(i.aa_dir)}</td></tr>
      <tr><td>Platform / store / version</td><td>${esc(i.platform_folder)} / ${esc(i.store)} / ${esc(i.version || "unknown")}</td></tr>
      <tr><td>Game process</td><td class="${S.running ? "bad" : "ok"}">${S.running ? "running or updating: install is blocked" : "not running"}</td></tr></table>`
      : `<p class="warn">No install selected.</p>`}
    <div class="row"><button id="det">Auto-detect</button><input id="gd" size="70" placeholder="or paste the path to the game folder or .app"><button id="setgd">Use path</button></div>
    ${(S.candidates || []).map(c => `<div class="row mono"><button data-gd="${esc(c.game_dir)}">Select</button>${esc(c.game_dir)}</div>`).join("")}
    ${S.candidates && !S.candidates.length ? `<p class="dim">Nothing found in the Steam, Epic or Applications folders.</p>` : ""}</div>
  <div class="box"><h3>Vanilla snapshot and index</h3>
    <p>${S.vanilla ? `Snapshot taken ${esc(S.vanilla.taken_utc)}, game build ${esc(S.vanilla.game_build || "unknown")}.` : "No snapshot yet."}
       ${S.indexed ? `Index: ${S.index_stats.sheets} sheets, ${S.index_stats.tokens} tokens, ${S.index_stats.literals} literal colours.` : "Not indexed."}
       UnityPy: <span class="${S.unitypy ? "" : "bad"}">${esc(S.unitypy || "not installed")}</span></p>
    ${S.decode_failures && S.decode_failures.count ? (() => { const d = S.decode_failures, c = k => d.classes[k] || {entries: 0, unique: 0}, ba = c("byte-alpha candidate"), hd = c("hdr"), un = c("unclassified");
      return `<details open><summary class="warn">${d.count} bundle colour entries (${d.unique} unique colours) are quarantined: ${ba.entries} byte-alpha candidates, ${hd.entries} hdr${un.entries ? `, <span class="bad">${un.entries} unclassified</span>` : ""}</summary>
      <p><b>Byte-alpha candidates (${ba.entries} entries, ${ba.unique} colours):</b> RGB is a valid 0..1 colour, the stored alpha is an integer above 1 that fits the 0..255 byte scale. The alpha shown is stored/255 and is for display only.<br>
        <b>hdr (${hd.entries} entries, ${hd.unique} colours):</b> a red, green or blue component is above 1. Kept as raw floats, no hex rendering, excluded from literal swaps permanently.</p>
      <p class="warn">None of these is offered as a literal, and a build never rewrites any of them. Pending in-game check for the byte-alpha candidates: look at the selected cell of the Squad streamed table. Solid #AF78FF means the game clamps alpha above 1 to opaque; translucent means the byte scale is live. The quarantine stays until that observation is reported (diagnostics/README.md).</p>
      <div class="list" style="max-height:30vh"><table><tr><th>Class</th><th>Shown as</th><th>Raw r, g, b, a</th><th>Sheet</th><th>Rule</th><th>Selector</th><th>Property</th></tr>
      ${d.rows.map(x => `<tr><td>${esc(x.class)}</td><td>${x.display ? fmt(x.display) : `<span class="dim">no hex</span>`}</td><td class="mono">${esc(x.raw.map(v => +v.toFixed(4)).join(", "))}</td><td>${esc(x.sheet)}</td><td>${x.rule}</td><td class="mono">${esc(x.selector)}</td><td class="mono">${esc(x.property)}</td></tr>`).join("")}</table></div></details>`; })() : ""}
    ${S.legacy_alpha.length ? `<details><summary class="warn">${S.legacy_alpha.length} percent-style alpha value(s) in legacy project data were divided by 100 (logged in logs/app.log)</summary><table><tr><th>Boundary</th><th>Where</th><th>Original</th><th>Stored</th></tr>
      ${S.legacy_alpha.map(x => `<tr><td>${esc(x.boundary)}</td><td class="mono">${esc(x.context)}</td><td>${x.original}</td><td>${x.stored}</td></tr>`).join("")}</table></details>` : ""}
    ${S.live ? `<table><tr><th>Bundle</th><th>Live file</th></tr>${Object.entries(S.live).map(([n, v]) =>
      `<tr><td class="mono">${esc(n)}</td><td class="${st[v.state]}">${esc(v.state)}</td></tr>`).join("")}</table>` : ""}
    ${S.live && Object.values(S.live).some(v => v.state === "changed") ? `<p class="warn">Live files match neither the snapshot nor the last install: the game was updated or verified. Restore stock files through Steam if a skin might still be in place, then take a new snapshot and re-index.</p>` : ""}
    ${S.snapshot_mismatch ? `<p class="bad">Wrong snapshot: ${esc(S.snapshot_mismatch)} Install and "Restore stock files" are blocked until then.</p>` : ""}
    ${i && i.other_copies && i.other_copies.length ? `<p class="dim">Other copies of the game's files under the game folder (ignored): ${i.other_copies.map(x => `<span class="mono">${esc(x)}</span>`).join(", ")}</p>` : ""}
    ${(() => { const T = S.tamper; if (!T) return "";
      if (T.state === "clean") return `<p class="ok">Tamper check: all ${T.checked} UI bundles are stock${Object.values(T.files).includes("skinned") ? " (or this app's installed skin)" : ""}.${T.new.length ? ` ${T.new.length} new bundle(s) have no reference hash.` : ""}</p>`;
      return `<p class="${T.state === "no_reference" ? "warn" : "bad"}">Tamper check: ${esc(T.message)}</p>`; })()}
    <div class="row"><button id="snap" ${i ? "" : "disabled"}>${S.vanilla ? "Replace snapshot" : "Take vanilla snapshot"}</button>
      <button id="idx" class="pri" ${S.vanilla ? "" : "disabled"}>Build index</button>
      ${S.vanilla && !S.vanilla.reference ? `<button id="refh" ${i ? "" : "disabled"}>Record reference hashes</button>` : ""}<span class="jobbar"></span></div>
    <p class="dim">${S.vanilla && S.vanilla.reference ? `Reference hashes: catalog ${esc(String(S.vanilla.reference.catalog_hash).slice(0, 12))}, ${Object.keys(S.vanilla.reference.bundles).length} layout bundles (hashes only, no copies).` : S.vanilla ? "This snapshot has no reference hashes, so a layout dump cannot be checked against the game files. Record them with the game closed and stock files." : ""}</p>
    <p class="dim">The snapshot copies the two style bundles from the game folder. Take it only while the game files are stock. Workspace: <span class="mono">${esc(S.workspace)}</span></p></div>
  <div class="box"><h3>Layout data</h3>${(() => { const L = S.layout;
    return L && L.present ? `<table><tr><td>Dump</td><td>game build <span class="mono">${esc(L.game_build)}</span>, exported ${esc(L.exported_at)}, from <span class="mono">${esc(L.source_name || "")}</span></td></tr>
      <tr><td>Fingerprint</td><td class="mono">${esc(L.fingerprint)} <span class="dim">${L.changed_vs_previous === null ? "first dump" : L.changed_vs_previous ? "changed vs previous " + esc(L.previous_fingerprint) : "same as previous"}</span></td></tr>
      <tr><td>Staleness</td><td class="${{fresh: "ok", stale: "bad", contaminated: "bad", unknown: "warn"}[L.staleness.status]}">${esc(L.staleness.status)} <span class="dim">(read from ${esc(L.source.platform_folder)}, catalog ${esc(L.source.catalog_hash)}, ${L.source.bundles} bundles)</span></td></tr>
      ${L.runtime_classes_provenance ? `<tr><td>Runtime classes</td><td class="dim">${esc(L.runtime_classes_provenance)}</td></tr>` : ""}</table>
      ${L.staleness.status !== "fresh" ? `<p class="${L.staleness.status === "unknown" ? "warn" : "bad"}">${esc(L.staleness.message)}</p>` : ""}` : `<p class="warn">No layout dump imported. "Where it paints" and the layout features need one.</p>`; })()}
    <div class="row"><input type="file" id="ldump" accept=".json,application/json"><button id="limp">Import layout dump</button></div>
    <div id="lerr"></div>
    <p class="dim">The dump (schema fmlayout-index/2, docs/fmlayout-index-2.md) is read-only input from the external layout indexer. It is validated as a whole: a file that breaks the contract is refused and nothing is loaded. Its file hashes are compared with the snapshot's reference hashes: a dump read from modified files (contaminated) is refused. It has no geometry, and results are a lower bound (no template or table-factory references).</p></div>  <div class="box"><h3>Launcher and server</h3>
    <div class="row"><button id="mkl">Create launcher</button><button id="quit">Quit server</button></div>
    <p class="dim">Create launcher makes "FM27 Skin Editor.app" (in Applications when writable, otherwise next to the app folder) so the app starts by double-click. The server keeps running after this tab is closed; Quit server stops it.</p></div>`;
  $("mkl").onclick = async () => { const p = await api("/api/launcher", {});
    if (!confirm((p.macos ? "" : "This computer is not a Mac; the launcher only runs on macOS.\n\n") + "Create the launcher here?\n\n" + p.app +
      (p.exists ? "\n(replaces the existing launcher)" : "") + "\n\nIt will start the app from:\n" + p.project + "\nwith the workspace:\n" + p.workspace)) return;
    const r = await api("/api/launcher", {confirm: true, target_dir: p.target_dir});
    say("Launcher created:\n" + r.app + "\nDrag it to the Dock if you like. Create it again after moving the app folder or the workspace.", true); };
  $("quit").onclick = async () => { if (!confirm("Stop the server? Unsaved edits in this tab are lost. Start again with the launcher.")) return;
    await api("/api/quit", {}); document.body.innerHTML = '<p style="padding:40px">The server has stopped. Close this tab. Click the FM27 Skin Editor icon to start again.</p>'; };
  $("det").onclick = async () => { await api("/api/detect", {}); drawSetup(); };
  $("setgd").onclick = async () => { await api("/api/config", {game_dir: $("gd").value}); drawSetup(); };
  $("setup").querySelectorAll("[data-gd]").forEach(b => b.onclick = async () => { await api("/api/config", {game_dir: b.dataset.gd}); drawSetup(); });
  $("snap").onclick = async () => { const force = !!S.vanilla;
    if (force && !confirm("Replace the vanilla snapshot with the files currently in the game folder? Only do this when those files are stock.")) return;
    await api("/api/snapshot", {force}); drawSetup(); };
  if ($("refh")) $("refh").onclick = async () => { if (!confirm("Record reference hashes of the game's catalog and layout bundles? Only do this when the game is closed and the files are stock.")) return;
    await api("/api/reference-hashes", {}); drawSetup(); };
  $("idx").onclick = async () => { await job(api("/api/index", {})); drawSetup(); };
  $("limp").onclick = async () => { const f = $("ldump").files[0]; if (!f) return say("Choose a layout dump (.json) first");
    const r = await fetch("/api/layout/import?name=" + encodeURIComponent(f.name), {method: "POST", headers: {"X-Token": T}, body: await f.arrayBuffer()}), j = await r.json();

async function literalDetail(c) { const r = await api(`/api/literal?rgb=${encodeURIComponent(c.rgb)}&a=${c.a}`), from = {rgb: c.rgb, a: c.a};

  $("ldetail").innerHTML = `<div class="box"><h3>Literal</h3><p>${fmt(from)}</p>
    <h3>Mode "rgba": swap this exact RGBA (${r.exact.length} hits)</h3>
    <div class="row">${rgbaEditor("lit", from)}<button class="pri" id="lrgba">Swap ${r.exact.length} exact hits</button></div>
    <p class="dim">Only uses with this RGB and this alpha change; the new colour brings its own alpha.</p>
    <h3>Mode "rgb-keep-alpha": swap every alpha of ${esc(c.rgb)} (${r.rgb_all.length} hits)</h3>
    <div class="row">${rgbaEditor("litrgb", from, true)}<button id="lrgb">Swap ${r.rgb_all.length} hits, each keeps its alpha</button></div>

    <details><summary>All ${r.rgb_all.length} uses of ${esc(c.rgb)} with their alphas</summary><div class="list" style="max-height:38vh"><table>${hitRows(r.rgb_all, false)}</table></div></details></div>
    <div id="lwhere"></div>`;
  whereInto("lwhere", `/api/where/literal?rgb=${encodeURIComponent(c.rgb)}&a=${c.a}`, whereLiteralHtml);
  const add = async sw_ => { if (!needProject()) return;
    P.literal_swaps = P.literal_swaps.filter(x => !(x.mode === sw_.mode && (sw_.mode === "rgba" ? Col.same(x.from, sw_.from) : x.from.rgb.toUpperCase() === sw_.from.rgb)));

    P.scoped_rules.push({sheet: h.sheet, selector: h.selectors.join(", "), props: {[h.property]: value}, why: "literal " + Col.text(from) + " in this rule"});

    const s = await api(`/api/preview/suggest?name=${encodeURIComponent(PV.name)}&rgb=${encodeURIComponent(r.vanilla.slice(0, 7))}`);
    if ($("pvsug")) $("pvsug").innerHTML = `<h3>Nearest tokens that paint this screen</h3><table>${s.map(x => `<tr><td class="mono">${esc(x.token)}</td><td>${sw(x.colour)}<span class="mono">${esc(x.colour)}</span></td><td class="dim">${x.distance}</td></tr>`).join("")}</table>
      <p class="dim">Suggestions only: a token that paints nearby with a similar colour may be what you meant to change.</p>`;
  }
}

/* ---------- images and SVGs
   Every texture and SVG (VectorImage) in the game's ui-* bundles. Pick one, give it a replacement (PNG/JPG/WebP for an image, SVG
   for an SVG); the project stores it and Build writes it into a fresh copy of the bundle (same size, same format), checked by the
   gate and installed with a backup like the style bundles. */
const IM = {cat: null, sel: null, q: "", group: "competition", kind: "all", big: true, limit: 240};
const thumbUrl = r => `/api/images/thumb?bundle=${encodeURIComponent(r.bundle)}&path_id=${r.path_id}&t=${encodeURIComponent(T)}`;
const srcUrl = e => `/api/images/source?project=${encodeURIComponent(P.name)}&file=${encodeURIComponent(e.source)}&t=${encodeURIComponent(T)}&v=${Date.now()}`;
function imDefaultWhere(n) { n = n.toLowerCase();       /* mirrors native.default_places */
  if (n.includes("start_screen") || n.includes("newgame")) return ["start-screen"];
  if (n.includes("background-texture") || n.includes("loading")) return ["loading"];
  if (n.includes("lineup") || n.includes("prematch")) return ["match-intro"];
  return ["report-pages", "main-screens"]; }
async function drawImages() { if (!S) await refresh(); if (!IM.places) { try { IM.places = (await api("/api/native/info")).places; } catch (e) {} }
  if (!S.install) { $("images").innerHTML = `<div class="box"><p class="warn">Select the game folder on the Setup tab first.</p></div>`; return; }
  if (!IM.cat) { $("images").innerHTML = `<div class="box"><p class="dim">Reading the images in the game's UI bundles (first time only, a few seconds) ...</p></div>`; IM.cat = await api("/api/images/catalog"); }
  const swaps = P?.image_swaps || [], key = r => r.bundle + "#" + r.path_id, swapped = new Set(swaps.map(key));
  const q = IM.q.toLowerCase();
  const rows = IM.cat.filter(r => (IM.group === "all" || r.group === IM.group || (IM.group === "swapped" && swapped.has(key(r)))) && (IM.kind === "all" || r.kind === IM.kind)
    && (!IM.big || r.kind !== "texture" || r.w * r.h >= 640 * 360) && (!q || r.name.toLowerCase().includes(q) || r.bundle.includes(q)));
  const groups = ["competition", "wallpaper", "room", "prematch", "menu", "icon", "other"];
  $("images").innerHTML = `<div class="pv"><div>
    <div class="row"><input id="imq" placeholder="Search name (bundesliga, ucl, skin_blended ...)" size="34" value="${esc(IM.q)}">
      <select id="img">${["swapped", "all", ...groups].map(g => `<option ${g === IM.group ? "selected" : ""} value="${g}">${g === "swapped" ? "swapped in this project" : g}</option>`).join("")}</select>
      <select id="imk">${["all", "texture", "svg", "icon"].map(k => `<option ${k === IM.kind ? "selected" : ""}>${k}</option>`).join("")}</select>
      <label><input type="checkbox" id="imbig" ${IM.big ? "checked" : ""}> large images only</label>
      <span class="dim">${rows.length} of ${IM.cat.length}</span><button id="imre" title="Re-read the game's bundles">Refresh</button>
      <button id="imexp" title="Write every image in this list at its true size (PNG; SVG plus an 8x PNG; icons at 1x to 4x) into a folder">Export these ${rows.length}</button><span class="jobbar"></span></div>
    <div class="imgrid">${rows.slice(0, IM.limit).map((r, k) => `<div class="imc ${IM.sel && key(IM.sel) === key(r) ? "on" : ""} ${swapped.has(key(r)) ? "sw" : ""}" data-k="${k}">
      <img loading="lazy" src="${thumbUrl(r)}" alt=""><div class="n">${esc(r.name)}</div><div class="d">${r.kind === "svg" ? "SVG" : r.kind === "icon" ? "icon" : esc(r.format)} ${r.w}x${r.h}${swapped.has(key(r)) ? ` &middot; <span class="ok">swapped</span>` : ""}</div></div>`).join("")}</div>
    ${rows.length > IM.limit ? `<div class="row"><button id="immore">Show more (${rows.length - IM.limit} left)</button></div>` : ""}
    </div><div id="imside"></div></div>`;
  $("imq").oninput = e => { IM.q = e.target.value; clearTimeout(drawImages.t); drawImages.t = setTimeout(drawImages, 250); };
  $("img").onchange = e => { IM.group = e.target.value; IM.limit = 240; drawImages(); };
  $("imk").onchange = e => { IM.kind = e.target.value; drawImages(); };
  $("imbig").onchange = e => { IM.big = e.target.checked; drawImages(); };
  $("imre").onclick = async () => { IM.cat = await api("/api/images/catalog?refresh=1"); drawImages(); };
  $("imexp").onclick = async () => { if (!confirm(`Export ${rows.length} image(s) at their true size into a folder in the workspace?`)) return;
    const r = await job(api("/api/images/export-all", {group: IM.group === "swapped" ? "all" : IM.group, kind: IM.kind, q: IM.q, big: IM.big}));
    say(`Exported ${r.items} item(s)${r.errors ? ", " + r.errors + " error(s)" : ""} to\n${r.folder}`, !r.errors); await api("/api/open-folder", {path: r.folder}); };
  if ($("immore")) $("immore").onclick = () => { IM.limit += 480; drawImages(); };
  $("images").querySelectorAll(".imc").forEach(c => c.onclick = () => { IM.sel = rows[+c.dataset.k]; $("images").querySelectorAll(".imc").forEach(x => x.classList.toggle("on", x === c)); imSide(); });
  const qi = $("imq"); if (document.activeElement !== qi && IM.q) { qi.focus(); qi.setSelectionRange(IM.q.length, IM.q.length); }
  imSide(); }
function imSide() { const side = $("imside"); if (!side) return; const r = IM.sel, swaps = P?.image_swaps || [];
  if (!r) { side.innerHTML = `<div class="box"><h3>Image swaps${P ? " in " + esc(P.name) : ""} (${swaps.length})</h3>
      ${swaps.length ? `<table>${swaps.map((e, k) => `<tr class="pick" data-k="${k}"><td><img src="${srcUrl(e)}" style="width:96px" class="imbig"></td><td class="mono">${esc(e.name)}<br><span class="dim">${esc(e.bundle)}</span></td></tr>`).join("")}</table>` : `<p class="dim">None yet. Pick an image on the left.</p>`}
      <p class="dim">Competition wallpapers are chosen by the game for your club's competition. The *_blended copies (report and tool pages) are recoloured with your club colour by the game, so only the light and dark of a replacement show there. Build and Install as usual.</p></div>`;
    side.querySelectorAll("[data-k]").forEach(tr => tr.onclick = () => { const e = swaps[+tr.dataset.k]; IM.sel = IM.cat.find(x => x.bundle === e.bundle && x.path_id === e.path_id) || null; imSide(); });
    return; }
  const cur = swaps.find(e => e.bundle === r.bundle && e.path_id === r.path_id);
  const warn = [r.name.includes("blended") ? "The game recolours this wallpaper with your club colour: only the light and dark of your image show." : "",
    /Crunched/.test(r.format || "") ? "Stored Crunch-compressed; your image is written as plain " + r.format.replace("Crunched", "") + " (larger file)." : "",
    r.mips > 1 ? `Has ${r.mips} mip levels; written with 1.` : "",
    r.kind === "svg" ? "Filled shapes only: strokes and gradients are not converted (outline strokes to paths first). The SVG is scaled into the icon's box, aspect kept." : "",
    r.kind === "icon" ? "Bitmap icon packed in the icon atlases: your PNG or SVG is drawn into its slot at all four UI scales (1x to 4x, aspect kept). The atlases are Crunch-compressed and are written back as plain DXT5 (a few MB larger)." : ""].filter(Boolean);
  side.innerHTML = `<div class="box"><h3>${esc(r.name)}</h3><img class="imbig" src="${thumbUrl(r)}">
    <table><tr><td>Bundle</td><td class="mono">${esc(r.bundle)}</td></tr><tr><td>Type</td><td>${r.kind === "svg" ? "SVG (VectorImage), " + r.triangles + " triangles" : r.kind === "icon" ? "icon in atlas " + esc(r.atlas) : "image, " + esc(r.format)}</td></tr>
      <tr><td>Size</td><td>${r.w} x ${r.h}</td></tr><tr><td>Path id</td><td class="mono">${r.path_id}</td></tr>${r.classes ? `<tr><td>USS class</td><td class="mono">${r.classes.map(c => "." + esc(c)).join("<br>")}</td></tr>` : ""}</table>
    ${warn.map(w => `<p class="warn">${esc(w)}</p>`).join("")}
    ${cur ? `<h3>Replacement</h3><img class="imbig" src="${srcUrl(cur)}"><div class="row"><button id="imdel">Remove swap</button></div>` : ""}
    ${cur && r.kind === "texture" && IM.places ? `<h3>Native skin: show it on</h3><div id="imwhere">${Object.entries(IM.places).map(([k, label]) =>
      `<label style="display:block"><input type="checkbox" value="${k}" ${(cur.where || imDefaultWhere(r.name)).includes(k) ? "checked" : ""}> ${esc(label)}</label>`).join("")}</div>
      <p class="dim">The game picks wallpapers in code, so a native skin hides or covers its picture on these places and paints yours (as the Jonukas skin does). The bundle route replaces the texture itself instead.</p>` : ""}
    <h3>${cur ? "Replace with another file" : "Swap"}</h3>
    <div class="row"><input type="file" id="imf" accept="${r.kind === "svg" ? ".svg,image/svg+xml" : r.kind === "icon" ? "image/png,image/jpeg,image/webp,.svg,image/svg+xml" : "image/png,image/jpeg,image/webp"}">
      ${r.kind === "texture" ? `<select id="imfit"><option value="cover">cover (fill, crop)</option><option value="contain">contain (fit, transparent bars)</option><option value="stretch">stretch</option></select>` : ""}
      <button class="pri" id="imgo">Use this file</button></div>
    <p class="dim">Stored in the project; nothing is written to the game until you Build and Install.</p>
    <div class="row"><a href="/api/images/export?bundle=${encodeURIComponent(r.bundle)}&path_id=${r.path_id}&t=${encodeURIComponent(T)}"><button>Export original at true size</button></a>
      <span class="dim">${r.kind === "icon" ? "zip: PNG at 1x, 2x, 3x, 4x (the exact slot sizes)" : r.kind === "svg" ? "zip: editable SVG + PNG at 8x" : "PNG, " + r.w + " x " + r.h}</span></div>
    <div class="row"><button id="imback">Back to the list of swaps</button></div></div>`;
  $("imback").onclick = () => { IM.sel = null; drawImages(); };
  $("imgo").onclick = async () => { if (!needProject()) return; const f = $("imf").files[0]; if (!f) return say("Choose a file first");
    const qs = new URLSearchParams({project: P.name, bundle: r.bundle, path_id: r.path_id, kind: r.kind, name: r.name, fit: $("imfit") ? $("imfit").value : "cover"});
    const res = await api("/api/images/swap?" + qs, await f.arrayBuffer(), true); P = res.project;
    say("Swap stored: " + r.name + (res.notes.length ? "\n" + res.notes.join("\n") : "") + "\nBuild and Install to put it in the game.", true); drawImages(); };
  if ($("imwhere")) $("imwhere").querySelectorAll("input").forEach(x => x.onchange = async () => {
    const where = [...$("imwhere").querySelectorAll("input:checked")].map(y => y.value);
    P = (await api("/api/images/where", {project: P.name, bundle: r.bundle, path_id: r.path_id, where})).project; });
  if (cur) $("imdel").onclick = async () => { P = (await api("/api/images/remove", {project: P.name, bundle: r.bundle, path_id: r.path_id})).project; say("Swap removed", true); drawImages(); };
}

/* ---------- compare another skin (read-only)
   A runtime USS skin folder (skin.json + .uss) or another skin's bundles, against vanilla: the tokens it changes, its own tokens,
   images and fonts, rule techniques; for bundles the textures and SVGs that differ. Its colours can be previewed on the measured
   screens or copied into a new project. Nothing is installed. */
const CM = {rep: null, q: "", only: true};
async function drawCompare() { if (!S) await refresh(); if (!CM.rep) { try { CM.rep = await api("/api/compare/state"); } catch (e) {} }
  const r = CM.rep;
  let html = `<div class="box"><h3>Compare a skin</h3><div class="row"><input id="cmp" size="70" placeholder="Folder of a skin (skin.json + .uss, or .bundle files) or one .bundle file" value="${esc(r?.path || "")}"><button class="pri" id="cmpgo">Load</button></div>
    <p class="dim">Read-only: nothing is installed or changed. USS skins are runtime skins for skin-loader mods; bundle skins replace game files.</p></div>`;
  if (r) {
    const q = CM.q.toLowerCase(), toks = r.tokens_changed.filter(t => (!q || t.token.includes(q)) && (!CM.only || t.theirs_colour || t.vanilla_colour));
    const swc = h => h ? `${sw(h)}<span class="mono">${esc(h)}</span>` : "";
    html += `<div class="cols"><div>
      <div class="box"><h3>${esc(r.name)} (${r.kind === "uss" ? "USS skin" : "bundles"})</h3>
        <table><tr><td>Tokens changed vs vanilla</td><td>${r.tokens_changed.length}</td></tr><tr><td>Own tokens</td><td>${r.tokens_new.length}</td></tr>
        ${r.kind === "uss" ? `<tr><td>Rules</td><td>${r.rules}</td></tr><tr><td>Images and fonts</td><td>${r.assets.length}</td></tr>` : `<tr><td>Images / SVGs that differ</td><td>${r.images_changed.length}</td></tr>`}</table>
        <div class="row"><button class="pri" id="cmpprev">Preview its colours on the screens</button><input id="cmpname" placeholder="new project name" size="18"><button id="cmpimp">Copy its colours into a new project</button></div>
        <p class="dim">Preview and copy use its colour tokens only${r.kind === "uss" ? "; its rules, images, fonts and transforms need its skin loader (see the rules list)" : ""}.</p></div>
      ${r.kind === "uss" ? `<div class="box"><h3>Sheets</h3><table><tr><th>Sheet</th><th>Tokens</th><th>Rules</th></tr>${r.sheets.map(s => `<tr><td class="mono">${esc(s.sheet)}</td><td>${s.root_tokens ?? ""}</td><td>${s.rules ?? (s.missing ? "missing" : "")}</td></tr>`).join("")}</table>
        <h3>Techniques</h3><table>${Object.entries(r.techniques).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("")}</table>
        <h3>Most used properties</h3><p class="mono dim">${r.top_properties.map(([k, v]) => esc(k) + " " + v).join(", ")}</p></div>
      <div class="box"><h3>Images and fonts (${r.assets.length})</h3><div class="imgrid">${r.assets.filter(a => a.kind === "image").map(a => `<div class="imc"><img loading="lazy" src="/api/compare/asset?file=${encodeURIComponent(a.file)}&t=${encodeURIComponent(T)}"><div class="n">${esc(a.file)}</div><div class="d">${a.w || "?"}x${a.h || "?"} &middot; ${esc(a.sheets.join(", "))}</div></div>`).join("")}</div>
        <p class="mono dim">${r.assets.filter(a => a.kind === "font").map(a => esc(a.file)).join(", ")}</p></div>
      <details class="box"><summary>Rules (first ${r.rule_samples.length})</summary><div class="list" style="max-height:50vh"><table>${r.rule_samples.map(x => `<tr><td class="dim">${esc(x.sheet)}</td><td class="mono">${esc(x.selector)}</td><td class="mono">${x.decls.map(([k, v]) => esc(k) + ": " + esc(v)).join("<br>")}</td></tr>`).join("")}</table></div></details>`
      : `<div class="box"><h3>Bundles</h3><table>${r.bundles.map(b => `<tr><td class="mono">${esc(b.bundle)}</td><td>${b.sheets != null ? b.sheets + " sheets, " + b.rules + " rules (vanilla " + (b.rules_vanilla ?? "?") + ")" : b.changed != null ? b.changed + " changed, " + b.added + " added, " + b.removed + " removed" : esc(b.note || "")}</td></tr>`).join("")}</table></div>
        ${r.images_changed.length ? `<div class="box"><h3>Images that differ: vanilla | theirs</h3><div class="list" style="max-height:60vh"><table>${r.images_changed.map(x => `<tr><td class="mono">${esc(x.name)}<br><span class="dim">${esc(x.bundle)}</span></td>
          <td><img loading="lazy" style="width:180px" class="imbig" src="/api/compare/thumb?side=vanilla&bundle=${encodeURIComponent(x.bundle)}&path_id=${x.path_id}&t=${encodeURIComponent(T)}"></td>
          <td><img loading="lazy" style="width:180px" class="imbig" src="/api/compare/thumb?side=theirs&bundle=${encodeURIComponent(x.bundle)}&path_id=${x.path_id}&t=${encodeURIComponent(T)}"></td></tr>`).join("")}</table></div></div>` : ""}`}
      </div><div>
      <div class="box"><h3>Tokens changed (${toks.length} of ${r.tokens_changed.length})</h3><div class="row"><input id="cmq" placeholder="filter token name" value="${esc(CM.q)}"><label><input type="checkbox" id="cmonly" ${CM.only ? "checked" : ""}> colours only</label></div>
        <div class="list" style="max-height:70vh"><table><tr><th>Token</th><th>Vanilla</th><th>Theirs</th></tr>${toks.slice(0, 1500).map(t => `<tr><td class="mono">${esc(t.token)}</td><td>${swc(t.vanilla_colour) || `<span class="mono dim">${esc(t.vanilla)}</span>`}</td><td>${swc(t.theirs_colour) || `<span class="mono dim">${esc(t.theirs)}</span>`}</td></tr>`).join("")}</table></div></div>
      <div class="box"><h3>Its own tokens (${r.tokens_new.length})</h3><div class="list" style="max-height:30vh"><table>${r.tokens_new.map(t => `<tr><td class="mono">${esc(t.token)}</td><td class="dim">${esc(t.kind)}</td><td class="mono">${swc(t.theirs_colour) || esc(t.theirs)}</td></tr>`).join("")}</table></div></div>
      </div></div>`;
  }
  $("compare").innerHTML = html;
  $("cmpgo").onclick = async () => { const path = $("cmp").value.trim(); if (!path) return say("Type the folder of a skin");
    $("cmpgo").disabled = true; try { CM.rep = await api("/api/compare/load", {path}); } finally { drawCompare(); } };
  if (!r) return;
  $("cmq").oninput = e => { CM.q = e.target.value; clearTimeout(drawCompare.t); drawCompare.t = setTimeout(drawCompare, 250); };
  $("cmonly").onchange = e => { CM.only = e.target.checked; drawCompare(); };
  $("cmpprev").onclick = () => { PV.compare = true; show("preview"); };
  $("cmpimp").onclick = async () => { const name = $("cmpname").value.trim(); if (!name) return say("Type a name for the new project");
    const res = await api("/api/compare/import", {name}); P = res.project; await refresh(); say(`Project ${name} created with ${res.tokens} colour token(s)`, true); };
  const qi = $("cmq"); if (CM.q && document.activeElement !== qi) { qi.focus(); qi.setSelectionRange(CM.q.length, CM.q.length); }
}

/* ---------- native skin export (Build tab) */
let lastNative = null;
async function natDraw() { if (!$("natbox")) return; const info = await api("/api/native/info");
  const box = $("natbox"); if (!box) return;       /* the tab may have been redrawn or left while waiting: use the box that is on the page now */
  const r = lastNative;
  box.innerHTML = `<p class="dim">Writes ${esc(P?.name || "the project")} as a skin folder FM27 loads itself: no game file is changed, it survives updates, and you switch it in FM27 (cog > Preferences, next to "Reload Skin"). Exports colours, rules, club-colour removal (including the light-club top bar), icon / SVG swaps and wallpapers (hidden and covered on the places you pick on the Images tab).</p>
    <div class="row"><input id="natid" size="22" placeholder="folder name" value="${esc(r?.project === P?.name ? r.folder.split(/[\\/]/).pop() : (P?.name || ""))}"><input id="natdisp" size="22" placeholder="name in FM27" value="${esc(P?.name || "")}">
      <button class="pri" id="natgo" ${P ? "" : "disabled"}>Export skin</button></div>
    <p class="dim">Into: <span class="mono">${esc(info.skins_root || "no FM27 user folder found")}</span>${info.installed.length ? ` &middot; skins there: ${info.installed.map(esc).join(", ")}` : ""}</p>
    ${r ? `<p class="${r.problems.length ? "bad" : "ok"}">Exported ${esc(r.skin)}: ${r.tokens} token(s), ${r.rules} rule(s), ${r.images} image(s)${r.problems.length ? " &middot; " + r.problems.length + " problem(s)" : ", checks passed"}.</p>
      ${r.problems.map(x => `<p class="bad mono">${esc(x)}</p>`).join("")}${r.skipped.map(x => `<p class="warn">Skipped: ${esc(x)}</p>`).join("")}${r.notes.map(x => `<p class="dim">${esc(x)}</p>`).join("")}
      <div class="row"><button id="natopen">Open the skin folder</button></div>` : ""}`;
  $("natgo").onclick = async () => { lastNative = await api("/api/native/export", {project: P.name, id: $("natid").value.trim(), display: $("natdisp").value.trim()});
    say("Skin exported to\n" + lastNative.folder + "\nIn FM27: Preferences > pick it next to Reload Skin.", !lastNative.problems.length); natDraw(); };
  if ($("natopen")) $("natopen").onclick = () => api("/api/open-folder", {path: lastNative.folder}); }

/* ---------- verify */
async function drawVerify() { const models = await api("/api/models");
  $("verify").innerHTML = `<div class="box"><h3>Screenshot check</h3>
    ${models.length ? `<div class="row"><select id="vm">${models.map(m => `<option>${esc(m)}</option>`).join("")}</select><input type="file" id="vf" accept="image/png"><button class="pri" id="vgo">Compare</button></div>
      <p class="dim">Take a screenshot of the same screen in the game with ${P ? "<b>" + esc(P.name) + "</b>" : "the skin"} installed (same aspect as the model, 16:9). Each opaque background region the model can judge is sampled at its centre: landed = the expected ${P ? "skin" : "vanilla"} colour, not landed = still the vanilla colour.</p>`
      : `<p class="warn">No preview models are shipped in data/models. They have to be measured on a Windows machine with the inspector and saved in the format described in skin_editor/verify.py.</p>`}
    <div id="vout"></div></div>`;
  if (!models.length) return;
  $("vgo").onclick = async () => { const f = $("vf").files[0]; if (!f) return say("Choose a PNG screenshot");
    const r = await api("/api/verify?model=" + encodeURIComponent($("vm").value) + (P ? "&project=" + encodeURIComponent(P.name) : ""), await f.arrayBuffer(), true);
    const cls = {landed: "ok", not_landed: "bad", unknown: "warn", info: "dim"};
    $("vout").innerHTML = `<p>${r.landed} landed, ${r.not_landed} not landed</p><table><tr><th>Region</th><th>Expected</th><th>Got</th><th>Max delta</th><th>Result</th><th>Entry</th></tr>
      ${r.rows.map(x => `<tr><td>${esc(x.id)}</td><td class="mono">${sw(x.expected)}${esc(x.expected)}</td><td class="mono">${sw(x.got)}${esc(x.got)}</td><td>${x.max_delta}</td><td class="${cls[x.result]}">${esc(x.result)}</td><td class="mono">${esc(x.entry || "")}</td></tr>`).join("")}</table>`; };
}

show("setup");
</script>
</body>
</html>
