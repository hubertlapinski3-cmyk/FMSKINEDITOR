name: ci

# The game-free suites on every push and pull request. Tests that need the game install, Edge or the inspector captures skip themselves; the skip count is printed so a
# green run cannot hide that most of the calibration did not run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python suite (game-free tests run, the rest skip; the summary line shows how many)
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath unittest.log | Select-Object -Last 15
          $skipped = (Select-String -Path unittest.log -Pattern 'skipped' | Select-Object -Last 1).Line
          Write-Host "::notice title=skips::$skipped"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Studio (type check, tests) and lint
        working-directory: studio
        shell: pwsh
        run: |
          npm ci
          npm test
          npx oxlint