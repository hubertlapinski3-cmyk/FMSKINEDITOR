name: ci

# The game-free suites on every push and pull request. Tests that need the game install, Edge or the inspector captures skip themselves; the skip count is printed so a
# green run cannot hide that most of the calibration did not run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python suite (game-free tests run, the rest skip; the summary line shows how many)
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v *> unittest.log
          $code = $LASTEXITCODE
          Get-Content unittest.log | Select-Object -Last 12
          $summary = (Select-String -Path unittest.log -Pattern '^(OK|FAILED)' | Select-Object -Last 1).Line
          Write-Host "::notice title=suite summary (skips included)::$summary"
          Select-String -Path unittest.log -Pattern '^(FAIL|ERROR): ' | ForEach-Object { Write-Host "::error title=failing test::$($_.Line)" }
          Select-String -Path unittest.log -Pattern '^(AssertionError|[A-Za-z]*Error)' | Select-Object -First 5 | ForEach-Object { Write-Host "::error title=reason::$($_.Line)" }
          if ($code -ne 0) { exit 1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Studio (type check, tests) and lint
        working-directory: studio
        shell: pwsh
        run: |
          npm ci
          npm test
          npx oxlint