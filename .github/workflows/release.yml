name: release

# Push a tag like v0.1.1 (it must equal the version in studio/src-tauri/tauri.conf.json) to build the Windows installer,
# sign the update with the updater key, and publish the GitHub release together with latest.json (the file the installed app polls).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned from the action's published release tag; was @v4)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (pinned from the action's published release tag; was @v5)
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (pinned from the action's published release tag; was @v4)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable (pinned from the action's branch; was @stable)
        with:
          toolchain: stable                     # needed once the action is pinned to a commit: the toolchain used to come from the ref name "stable"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 (pinned from the action's published release tag; was @v2)
        with:
          workspaces: studio/src-tauri

      - name: The tag must match the app version
        shell: pwsh
        run: |
          $v = (Get-Content studio/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match tauri.conf.json version $v" }

      - name: Freeze the engine (PyInstaller one-dir sidecar)
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python tools/freeze_engine.py
          if (-not (Test-Path build-sidecar/fm-skin-engine/fm-skin-engine.exe)) { throw "frozen engine missing" }

      - name: Self-test the frozen engine (the picture code must import in the frozen build)
        shell: pwsh
        run: |
          & build-sidecar/fm-skin-engine/fm-skin-engine.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "the frozen engine's self-test failed: a library the picture code needs is missing from the build" }

      - name: Install the Studio dependencies and run its tests
        working-directory: studio
        shell: pwsh
        run: |
          npm ci
          npm test

      # The Python suite needs a game install for its real-data tests, so it is not run here; run it locally before tagging.

      - name: Check the signing secrets before the long build (prints only lengths and pass/fail, never the secret)
        working-directory: studio
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $k = $env:TAURI_SIGNING_PRIVATE_KEY; $p = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # a key file is 348 characters of base64 that starts with the encoding of "untrusted comment:"
          $facts = "key: set=$([bool]$k) length=$($k.Length) trailingWhitespace=$($k -match '\s$') innerWhitespace=$($k.Trim() -match '\s') startsLikeKey=$($k.TrimStart().StartsWith('dW50cnVzdGVkIGNvbW1lbnQ6')) | password: set=$([bool]$p) length=$($p.Length) hasWhitespace=$($p -match '\s')"
          Write-Host "::notice title=signing secrets::$facts"
          Set-Content sigtest.txt x
          $out = npx tauri signer sign sigtest.txt 2>&1 | Out-String
          if (Test-Path sigtest.txt.sig) { Write-Host "::notice title=signing test::signed OK" }
          else { $m = (($out -split "`n" | Select-String 'rror|failed' | Select-Object -First 3) -join ' / '); Write-Host "::error title=signing test failed::$m"; exit 1 }

      - name: Release notes (docs/RELEASE-NOTES-<version>.md, else the Phase 8 pointer)
        shell: pwsh
        run: |
          $v = (Get-Content studio/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $f = "docs/RELEASE-NOTES-$v.md"
          $body = if (Test-Path $f) { Get-Content $f -Raw } else { "See docs/PHASE8-PLAN.md for what is in this release." }
          $d = [guid]::NewGuid().ToString("N")
          "RELEASE_NOTES<<$d`n$body`n$d" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2 (pinned from the action's published release tag; was @v0)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: studio
          tagName: ${{ github.ref_name }}
          releaseName: FM Skin Studio ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json

      # The calibration report ships alongside the installer as release assets (it is not part of the update feed).
      - name: Attach the calibration report
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content studio/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = $v -replace '\.', ''                                    # 1.1.0 -> 110: the report folder of THIS version is phase9-v110-calibration-*
          $src = Get-ChildItem docs/evidence -Directory | Where-Object { $_.Name -like "phase9-v$tag-calibration-*" } | Sort-Object Name | Select-Object -Last 1
          if ((-not $src) -and ($v -like '1.0.*')) { $src = Get-ChildItem docs/evidence -Directory | Where-Object { $_.Name -like 'phase9-m7-calibration-*' } | Sort-Object Name | Select-Object -Last 1 }   # 1.0.x: the frozen revised report sorts after the first one
          if (-not $src) { Write-Host "no calibration report of its own for $v (a repair release: the render is unchanged, the report of the release it repairs stands); none attached"; exit 0 }
          Copy-Item "$($src.FullName)/calibration-report.md" "calibration-report-$v.md"
          Copy-Item "$($src.FullName)/calibration-report.json" "calibration-report-$v.json"
          gh release upload "${{ github.ref_name }}" "calibration-report-$v.md" "calibration-report-$v.json" --clobber
