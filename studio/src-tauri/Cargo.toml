[package]
name = "fm-skin-studio"
version = "1.1.1"
description = "FM Skin Studio: desktop shell for the FM27 skin engine"
edition = "2021"

[lib]
name = "fm_skin_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
